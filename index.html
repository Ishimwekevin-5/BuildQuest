<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuildQuest | Engineers, Equipment & Land</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Saira:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Saira', sans-serif; 
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-color: #000;
            color: #fff;
        }
        .map-container .pigeon-click-block { border-radius: 0.5rem; }
        
        /* Custom scrollbar for dark theme */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #000;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        @keyframes pulse-glow {
          0%, 100% { box-shadow: 0 0 10px rgba(245, 158, 11, 0.4); }
          50% { box-shadow: 0 0 25px rgba(245, 158, 11, 0.7); }
        }
        .upi-badge-glow {
          animation: pulse-glow 2s infinite ease-in-out;
        }

        /* Tech Glow Animations */
        @keyframes tech-flicker {
          0%, 19.999%, 22%, 62.999%, 64%, 64.999%, 70%, 100% { opacity: 1; }
          20%, 21.999%, 63%, 63.999%, 65%, 69.999% { opacity: 0.4; }
        }

        @keyframes border-flow {
          0% { border-color: rgba(255, 255, 255, 0.1); }
          50% { border-color: rgba(255, 255, 255, 1); box-shadow: 0 0 15px rgba(255, 255, 255, 0.4); }
          100% { border-color: rgba(255, 255, 255, 0.1); }
        }

        @keyframes scanline {
          0% { transform: translateY(-100%); }
          100% { transform: translateY(100%); }
        }

        .tech-card-glow {
          position: relative;
          overflow: hidden;
          animation: border-flow 4s infinite ease-in-out;
        }

        .tech-card-glow::before {
          content: "";
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 2px;
          background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
          animation: scanline 3s infinite linear;
          opacity: 0.3;
          pointer-events: none;
        }

        .tech-flicker-text {
          animation: tech-flicker 8s infinite;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.37.0",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.12.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "pigeon-maps": "https://esm.sh/pigeon-maps@^0.22.1",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
<body class="bg-black text-white">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
